services:
  backend:
    build: 
      context: ./functions
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./functions/.env
    environment:
      - PORT=3001
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY:-${GOOGLE_API_KEY:-}}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-adaptive-supply-chain}

